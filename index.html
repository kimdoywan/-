<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF8F3">
  <title>구전이 | 구미새마을중앙시장</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#home" aria-label="처음 화면">
        <span class="brand-market" id="market-name"></span>
        <span class="brand-app" id="app-name"></span>
      </a>
      <button class="text-size-button" id="text-size-toggle" type="button" aria-pressed="false" title="큰 글자 켜기">
        <span class="text-size-glyph" aria-hidden="true">가</span>
        <span>큰 글자</span>
      </button>
    </header>

    <main class="app-main">
      <section class="screen home-screen" id="home-screen" aria-labelledby="home-title">
        <div class="home-intro">
          <p class="eyebrow">시장 안내</p>
          <h1 id="home-title">어디를 찾으세요?</h1>
        </div>

        <form class="search-form home-search" id="home-search-form" role="search">
          <label class="visually-hidden" for="home-search-input">점포 이름, 대표 상품, 업종 검색</label>
          <span class="search-mark" aria-hidden="true"></span>
          <input id="home-search-input" type="search" placeholder="점포 이름·대표 상품·업종 검색" autocomplete="off">
          <button type="submit">검색</button>
        </form>

        <nav class="quick-nav" aria-label="주요 메뉴">
          <button class="quick-button" type="button" data-screen="stores">
            <span class="quick-index">01</span>
            <span class="quick-label">점포찾기</span>
            <span class="quick-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="quick-button" type="button" data-screen="map">
            <span class="quick-index">02</span>
            <span class="quick-label">시장지도</span>
            <span class="quick-arrow" aria-hidden="true">↗</span>
          </button>
          <button class="quick-button" type="button" data-screen="parking">
            <span class="quick-index">03</span>
            <span class="quick-label">주차안내</span>
            <span class="quick-arrow" aria-hidden="true">↗</span>
          </button>
        </nav>

        <section class="home-section alley-section" aria-labelledby="alley-heading">
          <div class="section-heading">
            <p class="eyebrow">골목별로 둘러보기</p>
            <h2 id="alley-heading">시장 특화 골목</h2>
          </div>
          <div class="alley-list" id="home-alley-list"></div>
        </section>

        <section class="market-introduction" aria-labelledby="market-intro-heading">
          <p class="eyebrow" id="market-intro-heading">시장 소개</p>
          <p class="introduction-copy" id="market-intro"></p>
        </section>
      </section>

      <section class="screen stores-screen" id="stores-screen" aria-labelledby="stores-heading" hidden>
        <button class="back-button" type="button" data-screen="home"><span aria-hidden="true">←</span> 처음으로</button>
        <div class="page-heading">
          <p class="eyebrow">점포 안내</p>
          <h1 id="stores-heading">점포찾기</h1>
        </div>
        <form class="search-form stores-search" id="stores-search-form" role="search">
          <label class="visually-hidden" for="stores-search-input">점포 이름, 대표 상품, 업종 검색</label>
          <span class="search-mark" aria-hidden="true"></span>
          <input id="stores-search-input" type="search" placeholder="점포 이름·대표 상품·업종 검색" autocomplete="off">
          <button type="submit">검색</button>
        </form>
        <div class="filter-heading">
          <h2>업종</h2>
          <button class="clear-filter" id="clear-filters" type="button" hidden>필터 해제</button>
        </div>
        <div class="category-filters" id="category-filters" aria-label="업종 필터"></div>
        <p class="active-filter" id="active-alley" hidden></p>
        <div class="result-heading">
          <h2>점포 목록</h2>
          <p id="store-count" aria-live="polite"></p>
        </div>
        <div class="store-list" id="store-list"></div>
      </section>

      <section class="screen map-screen" id="map-screen" aria-labelledby="map-heading" hidden>
        <button class="back-button" type="button" data-screen="home"><span aria-hidden="true">←</span> 처음으로</button>
        <div class="page-heading">
          <p class="eyebrow">점포 안내</p>
          <h1 id="map-heading">시장지도</h1>
        </div>
        <p class="map-caption">제공된 좌표로 점포를 표시합니다. 점포를 누르면 상세 정보를 볼 수 있습니다.</p>
        <div class="map-stage" id="map-stage" aria-label="점포 위치"></div>
        <div class="map-legend" id="map-legend" aria-label="지도 점포 목록"></div>
      </section>

      <section class="screen parking-screen" id="parking-screen" aria-labelledby="parking-heading" hidden>
        <button class="back-button" type="button" data-screen="home"><span aria-hidden="true">←</span> 처음으로</button>
        <div class="page-heading">
          <p class="eyebrow">방문 안내</p>
          <h1 id="parking-heading">주차안내</h1>
        </div>
        <div class="parking-list" id="parking-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="footer-market" id="footer-market"></p>
      <p id="footer-address"></p>
      <a id="footer-phone"></a>
    </footer>
  </div>

  <div class="detail-backdrop" id="detail-backdrop" hidden>
    <section class="detail-sheet" id="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detail-name" tabindex="-1">
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="detail-close" id="detail-close" type="button" aria-label="상세 정보 닫기">×</button>
      <div id="detail-content"></div>
    </section>
  </div>
</body>
</html>
